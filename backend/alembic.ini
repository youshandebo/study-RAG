# Alembic configuration (optional dependency: pip install alembic)
#
# NOTE: This file MUST stay pure ASCII.
# Alembic reads alembic.ini with configparser using the *locale* encoding,
# which is GBK on a Chinese Windows host -- any UTF-8 multi-byte character
# here makes every `alembic` command die with UnicodeDecodeError.
# Chinese documentation lives in README.md and migrations/env.py instead.
#
# Not required in normal operation: relational._ensure_tables() still
# auto-creates tables and back-fills columns, so the project runs with
# zero extra dependencies. Alembic is for deployments that need a
# traceable, reviewable, rollback-able schema history.
#
# Common commands (run from the backend/ directory):
#   alembic upgrade head                        # apply all migrations
#   alembic revision -m "description"           # empty revision
#   alembic revision --autogenerate -m "desc"   # diff against models
#   alembic downgrade -1                        # roll back one step
#   alembic current / alembic history           # inspect state
#
# Adopting an existing database (tables already created by create_all):
#   alembic stamp head    # schema already matches, just record the version
#   alembic upgrade head  # (then apply future increments)

[alembic]
script_location = %(here)s/migrations

# Let migrations/env.py import app.*
prepend_sys_path = %(here)s

file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally empty: env.py resolves it from the
# project's single source of truth (ALEMBIC_DATABASE_URL > POSTGRES_DSN
# > local SQLite), so the DSN is not duplicated and cannot drift.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
