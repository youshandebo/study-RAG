<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">
<defs><radialGradient id="glow" cx="42%" cy="36%" r="85%"><stop offset="0%" stop-color="#325247"/><stop offset="70%" stop-color="#263e34"/><stop offset="100%" stop-color="#1c2e27"/></radialGradient><filter id="chalk" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter></defs>
<rect x="0" y="0" width="1280" height="760" rx="22" fill="url(#glow)"/>
<rect x="10" y="10" width="1260" height="740" rx="16" fill="none" stroke="#0f1d18" stroke-width="3" opacity="0.55"/>
<text x="640" y="88" font-size="44" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#f6f1dd" font-weight="bold" text-anchor="middle" opacity="0.94">核心方法 · 抓大头（同阶无穷大比阶）</text>
<path d="M 425 110 Q 640 126 855 106" stroke="#f0dca0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75" filter="url(#chalk)"/>
<text x="62" y="66" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="start" opacity="0.45">No.03</text>
<text x="110" y="205" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">当 </tspan><tspan font-size="34" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">x → +∞</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif"> 时，比较各项增长速度：</tspan></text>
<text x="180" y="310" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="44" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">x<tspan dy="-0.45em" font-size="27">3</tspan><tspan dy="0.45em">&#8203;</tspan></tspan><tspan font-size="40" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic" fill="#f0dca0">  ≫  </tspan><tspan font-size="44" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">x<tspan dy="-0.45em" font-size="27">2</tspan><tspan dy="0.45em">&#8203;</tspan></tspan><tspan font-size="40" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic" fill="#f0dca0">  ≫  </tspan><tspan font-size="44" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">√x</tspan><tspan font-size="40" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic" fill="#f0dca0">  ≫  </tspan><tspan font-size="44" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">ln x</tspan></text>
<path d="M 115 360 Q 375.0 367 635 360" stroke="#eef3ec" stroke-width="2.2" fill="none" opacity="0.42"/>
<text x="115" y="450" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-weight="bold">本例分母：</tspan></text>
<text x="185" y="530" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="44" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">x<tspan dy="-0.45em" font-size="27">2</tspan><tspan dy="0.45em">&#8203;</tspan> + ln x  ∼  x<tspan dy="-0.45em" font-size="27">2</tspan><tspan dy="0.45em">&#8203;</tspan></tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">   （ln x 可忽略）</tspan></text>
<path d="M 815 515 Q 889.0 489 935 515" stroke="#eef3ec" stroke-width="3.2" fill="none" stroke-linecap="round" opacity="0.9"/><path d="M 919 511 L 935 515 L 922 527" stroke="#eef3ec" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<text x="185" y="628" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="40" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic" fill="#f0dca0">∴ f(x) = √x ⁄ x<tspan dy="-0.45em" font-size="25">2</tspan><tspan dy="0.45em">&#8203;</tspan> ∼ 1 ⁄ x<tspan dy="-0.45em" font-size="25">3/2</tspan><tspan dy="0.45em">&#8203;</tspan></tspan></text>
<text x="160" y="700" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="26" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">对数增长再慢，也慢不过任意正幂 —— 这就是「抓大头」</tspan></text>
<text x="60" y="722" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="start" opacity="0.42">高等数学 · 反常积分专题</text>
<text x="1220" y="722" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="end" opacity="0.42">— 03 —</text>
</svg>
