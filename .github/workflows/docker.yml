# Docker 镜像云端构建：push 到 main 自动构建前后端镜像并推送 GHCR。
# 服务器部署只需 docker compose pull && up -d，无需在服务器上装构建环境。
# GHCR 包默认私有：仓库 Settings → Packages 可改 Public，或服务器 docker login ghcr.io。
name: Docker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: backend/Dockerfile
            image: studay-rag-backend
          - name: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            image: studay-rag-frontend
            build-args: |
              NEXT_PUBLIC_API_BASE=/api/proxy
          - name: single
            context: .
            dockerfile: docker/single.Dockerfile
            image: studay-rag
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
