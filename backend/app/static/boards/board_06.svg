<text x="155" y="222" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="33" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">等价代换只能整体替换，</tspan><tspan font-size="33" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eecfc4" font-weight="bold">不能在加减项里各抓各的大头！</tspan></text>
<text x="130" y="305" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-weight="bold">经典反例：</tspan><tspan font-size="34" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">tan x − sin x ∼ ?</tspan><tspan font-size="27" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">   若误取 </tspan><tspan font-size="34" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic" fill="#eecfc4">x − x = 0</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eecfc4" font-weight="bold">  ✗</tspan></text>
<text x="180" y="385" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">正确答案首项是 </tspan><tspan font-size="32" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">½x<tspan dy="-0.45em" font-size="20">3</tspan><tspan dy="0.45em">&#8203;</tspan></tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">，须泰勒展开后整体处理</tspan></text>
<path d="M 120 432 Q 625.0 439 1130 432" stroke="#eef3ec" stroke-width="2.2" fill="none" opacity="0.42"/>
<text x="130" y="505" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-weight="bold">安全做法：</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">① 通分成单一分式后再抓分子分母的大头</tspan></text>
<text x="195" y="572" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">② 加减结构优先提公因子或泰勒展开到首个非零项</tspan></text>
<text x="195" y="639" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">③ 替换完成后回代检验符号与阶数</tspan></text>
<text x="60" y="722" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="start" opacity="0.42">高等数学 · 反常积分专题</text>
<text x="1220" y="722" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="end" opacity="0.42">— 06 —</text>
