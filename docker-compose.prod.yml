# 生产部署编排：镜像由 GitHub Actions 构建并推送 GHCR，服务器免构建。
#
# 使用：
#   cp .env.example .env   # 按需修改（务必改掉 POSTGRES/MINIO 弱口令、设置 ADMIN_PASSWORD）
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 升级：git pull 后重复上面两条即可（数据全在具名卷中）。
#
# 内存优化（小服务器友好）：全服务已加内存上限，默认合计 ≈ 1.6GB：
#   backend 512M + frontend 256M + postgres 256M + redis 128M + qdrant 256M + minio 256M
# 极小内存机器（≤2GB）可注释掉 qdrant / minio（后端自动降级进程内向量库/本地磁盘），
# 合计可压到 ≈ 1.1GB。

services:
  backend:
    image: ghcr.io/youshandebo/studay-rag-backend:latest
    restart: unless-stopped
    # 只绑回环：公网访问走前端 /api/proxy 同源转发，backend 不暴露公网
    # 端口被占？.env 里改 BACKEND_PORT=18000 即可
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-}
      # 生产标记：backend 启动探针据此拒绝"缺 REDIS_URL 的静默降级"。
      # 无特殊需要不要改成 development，否则配额/闸门/限流会退回进程内口径。
      - ENV=${ENV:-production}
      - MEMBERSHIP_MODE=${MEMBERSHIP_MODE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - POSTGRES_DSN=postgresql+asyncpg://tutor:${POSTGRES_PASSWORD:-tutor}@postgres:5432/classroom
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - ALLOW_PRIVATE_LLM_HOSTS=${ALLOW_PRIVATE_LLM_HOSTS:-}
      # 多租户隔离：默认关闭（单租户 public）。开启前先跑
      # `python scripts/migrate_tenants.py` 给存量切片打标，否则旧数据不可见。
      - MULTI_TENANT_MODE=${MULTI_TENANT_MODE:-}
      # 小服务器友好：单 worker + 限并发（超并发排队而非 OOM）
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      - UVICORN_LIMIT_CONCURRENCY=${UVICORN_LIMIT_CONCURRENCY:-24}
      - MALLOC_ARENA_MAX=2   # 抑制 glibc 多 arena 虚拟内存膨胀
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend-data:/app/data          # runtime_config + jwt_secret 持久化
      - backend-static:/app/app/static  # 上传素材（未接 MinIO 时）

  frontend:
    image: ghcr.io/youshandebo/studay-rag-frontend:latest
    restart: unless-stopped
    # 端口被占？.env 里改 FRONTEND_PORT=8080 即可（容器内仍是 3000）
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # 代理目标必须含 /api/v1：前端请求 /api/proxy/sessions → 转发 /api/v1/sessions
      - BACKEND_ORIGIN=http://backend:8000/api/v1
      - NODE_OPTIONS=--max-old-space-size=192
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # 小内存调优：降 shared_buffers / 连接数（默认 128MB 缓冲 + 100 连接对小团队浪费）
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutor}
      POSTGRES_DB: classroom
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d classroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 仅用于多副本限流共享；单机部署数据为易失性限流窗口，可安全禁用持久化省内存
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    deploy:
      resources:
        limits:
          memory: 128M

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - minio-data:/data

volumes:
  backend-data:
  backend-static:
  pg-data:
  redis-data:
  qdrant-data:
  minio-data:
