# CI：后端单测 + 回归 + 前端类型检查与构建。AGPL-3.0-or-Commercial 双重许可项目。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Unit tests (retrieval / grading / security)
        working-directory: backend
        run: python -m pytest tests/ -q
      - name: E2E regression (admin + RAG pipeline)
        working-directory: backend
        run: python e2e_admin_test.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  # 迁移链校验上云：本地不再手工跑 alembic upgrade head。
  # SQLite 临时库走到 head + 防漂移测试（模型列必须都在迁移历史里），
  # 忘写迁移的提交在这里直接红，而不是等部署时才炸。
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest alembic
      - name: Migrate a fresh database to head
        working-directory: backend
        env:
          APP_DB_PATH: ${{ runner.temp }}/_ci_migrate.db
        run: python -m alembic upgrade head
      - name: Model/migration drift guard
        working-directory: backend
        run: python -m pytest tests/test_core_logic.py -q -k migrations
