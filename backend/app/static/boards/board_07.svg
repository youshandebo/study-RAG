<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">
<defs><radialGradient id="glow" cx="42%" cy="36%" r="85%"><stop offset="0%" stop-color="#325247"/><stop offset="70%" stop-color="#263e34"/><stop offset="100%" stop-color="#1c2e27"/></radialGradient><filter id="chalk" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter></defs>
<rect x="0" y="0" width="1280" height="760" rx="22" fill="url(#glow)"/>
<rect x="10" y="10" width="1260" height="740" rx="16" fill="none" stroke="#0f1d18" stroke-width="3" opacity="0.55"/>
<text x="640" y="88" font-size="44" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#f6f1dd" font-weight="bold" text-anchor="middle" opacity="0.94">辨析 · 什么才是瑕点</text>
<path d="M 425 110 Q 640 126 855 106" stroke="#f0dca0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75" filter="url(#chalk)"/>
<text x="62" y="66" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="start" opacity="0.45">No.07</text>
<text x="110" y="195" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">定义：若 </tspan><tspan font-size="32" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">lim<tspan dy="0.35em" font-size="20">x→c⁺</tspan><tspan dy="-0.35em">&#8203;</tspan></tspan><tspan font-size="32" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic"> f(x) = ∞</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">，则 </tspan><tspan font-size="31" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">x = c</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif"> 为瑕点</tspan></text>
<path d="M 122 235 L 1148 235 Q 1160 235 1160 247 L 1160 353 Q 1160 365 1148 365 L 122 365 Q 110 365 110 353 L 110 247 Q 110 235 122 235" stroke="#f0dca0" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.92"/>
<text x="160" y="285" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="28" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">常见候选：区间端点 ／ 分母零点 ／ ln 的自变量趋于 0 处</tspan></text>
<text x="160" y="342" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="28" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#f0dca0">注意：有限值 ≠ 无穷大，先代入验证再定性</tspan></text>
<text x="110" y="455" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-weight="bold">回到例题：</tspan><tspan font-size="32" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">x = 1</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif"> 代入 </tspan><tspan font-size="32" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">√1 ⁄ (1² + ln 1) = 1 ⁄ 1 = 1</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">，有限 ✓</tspan></text>
<text x="170" y="540" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">∴ 下限 </tspan><tspan font-size="30" font-family="'Cambria Math','Latin Modern Math','Georgia','Times New Roman',serif" font-style="italic">x = 1</tspan><tspan font-size="30" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eecfc4"> 不是瑕点，别画蛇添足拆成瑕积分！</tspan></text>
<path d="M 142 610 L 938 610 Q 950 610 950 622 L 950 674 Q 950 686 938 686 L 142 686 Q 130 686 130 674 L 130 622 Q 130 610 142 610" stroke="#f0dca0" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.92"/>
<text x="180" y="660.0" fill="#eef3ec" opacity="0.95" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" font-size="30"><tspan font-size="27" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif">自检清单：找零点 → 代入求值 → 结果有穷？⇒ 非瑕点</tspan></text>
<text x="60" y="722" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="start" opacity="0.42">高等数学 · 反常积分专题</text>
<text x="1220" y="722" font-size="19" font-family="'Xingkai SC','STXingkai','KaiTi','KaiTi SC','楷体','SimKai',serif" fill="#eef3ec" font-weight="normal" text-anchor="end" opacity="0.42">— 07 —</text>
</svg>
